[project]
name = "md2pdfx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca De Franceschi", email = "luca.defranceschi.91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "jinja2>=3.1.6",
    "libsass>=0.23.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pyyaml>=6.0.3",
    "weasyprint>=70.0",
]

[project.scripts]
md2pdfx = "md2pdfx:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
